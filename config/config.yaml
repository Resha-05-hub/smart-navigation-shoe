# Smart Navigation Shoe Configuration

system:
  # Default --mode: dashboard (full demo), fusion, scenario (no camera), detection, alerts, sensors, architecture
  mode: "dashboard"

camera:
  type: "webcam"       # Options: "webcam", "video", "raspberry_pi"
  device_id: 0
  width: 640           # Webcam capture width; video/image sources are downscaled to this width
  height: 480
  fps: 30
  # Video/image input: a video file, a single image, or a folder of images (played in name order).
  video_source: "demo/approach_demo.mp4"     # Used when type is "video"; --source PATH overrides
  fallback_source: "demo/approach_demo.mp4"  # Played automatically if the live camera fails ("" = none)
  loop: true               # Restart the video/images when they end
  realtime: true           # Keep source speed: skip frames when YOLO is slower than the video
  image_duration_s: 3.0    # Seconds each still image is shown

detection:
  model_path: "models/yolov8n.pt"
  confidence_threshold: 0.5
  iou_threshold: 0.45
  device: "cpu"        # Options: "cpu", "cuda"
  display:
    window_name: "Smart Navigation Shoe"
    show_confidence: true
    show_box: true
  # Only these COCO class names are detected (empty list = all 80 classes).
  # Stairs/doors are not COCO classes; low obstacles are caught by the distance sensors instead.
  target_classes:
    - person
    - bicycle
    - car
    - motorcycle
    - bus
    - truck
    - dog
    - chair
    - couch
    - potted plant
    - dining table
    - bottle
    - laptop
    - cell phone

tracking:
  enabled: true
  iou_threshold: 0.3     # Box overlap needed to treat a detection as the same object
  max_missed_frames: 3   # Keep an object this many frames after YOLO loses it
  min_hits: 2            # Frames an object must be seen before it is reported (drops one-frame ghosts)
  box_smoothing: 0.7     # Weight of the newest box (1.0 = no smoothing)

sensors:
  distance_sensor:
    type: "simulated"  # Options: "simulated", "ultrasonic" (HC-SR04 on Raspberry Pi, future hardware phase)
    min_distance_m: 0.2
    max_distance_m: 4.0
    simulated_default_m: 2.5
    simulated_positions:  # Startup distances (clear path); the scenario engine moves them at runtime
      left_cm: 300.0
      center_cm: 300.0
      right_cm: 300.0
    update_interval_sec: 0.1
    gpio_trigger_pins:   # BCM pin numbers for the future HC-SR04 hardware
      left: 23
      center: 17
      right: 22
    gpio_echo_pins:
      left: 24
      center: 27
      right: 10

  # Software-only demo: drives the SIMULATED distance sensors (no physical HC-SR04 hardware).
  simulation:
    startup: "camera"  # "camera" (camera-linked), "manual" (keyboard control), or a scenario name below
    step_cm: 10.0      # Distance change per key press
    noise_cm: 1.0      # Gaussian jitter mimicking real ultrasonic readings (0 = none)
    loop: true         # Scripted scenarios restart when finished (live camera modes)
    # Camera-linked mode: each zone's simulated sensor reads the nearest YOLO object's distance,
    # ESTIMATED with the pinhole model: distance = real_size * focal_px / box_size_px.
    camera_linked:
      horizontal_fov_deg: 60.0  # Laptop webcams are typically 55-78 deg; tune if distances read off
      smoothing: 0.5            # Weight of the newest estimate (1.0 = no smoothing)
      hold_s: 0.5               # Keep a distance this long when a detection flickers out
      default_size_m: [1.0, 0.5]  # [height, width] for classes not listed in the code defaults
      object_sizes_m:             # [height, width] per class; adds to or overrides the code defaults
        bottle: [0.25, 0.08]      # ~0.5-1 L drinks bottle, upright
        laptop: [0.25, 0.33]      # Open 13-15" laptop seen from the front
        cell phone: [0.15, 0.075] # Smartphone held upright
    # Keyframes: [time_s, left_cm, center_cm, right_cm]; values glide linearly between frames.
    # null = sensor fault (reported INVALID) from that keyframe until the next one.
    scenarios:
      approaching_obstacle:
        description: "Obstacle straight ahead closes from 3 m to 30 cm, then clears"
        keyframes:
          - [0, 300, 300, 300]
          - [2, 300, 300, 300]
          - [9, 300, 30, 300]
          - [12, 300, 30, 300]
          - [14, 300, 300, 300]
      passing_left_then_right:
        description: "Obstacle passes close on the left, then on the right"
        keyframes:
          - [0, 300, 300, 300]
          - [4, 60, 300, 300]
          - [6, 60, 300, 300]
          - [8, 300, 300, 300]
          - [12, 300, 300, 60]
          - [14, 300, 300, 60]
          - [16, 300, 300, 300]
      narrow_corridor:
        description: "Walls close in on both sides while the path ahead stays open"
        keyframes:
          - [0, 120, 300, 110]
          - [6, 70, 280, 80]
          - [10, 120, 300, 110]
      mixed_zones:
        description: "Static example: LEFT 150 cm (CAUTION), CENTER 80 cm (WARNING), RIGHT 220 cm (SAFE)"
        keyframes:
          - [0, 150, 80, 220]
      sensor_fault:
        description: "CENTER sensor fails for 4 s, then recovers"
        keyframes:
          - [0, 300, 120, 300]
          - [3, 300, null, 300]
          - [7, 300, 120, 300]
          - [10, 300, 120, 300]

risk_analysis:
  thresholds_cm:
    danger_cm: 50.0      # <= 50 cm = DANGER
    warning_cm: 100.0    # 50 - 100 cm = WARNING
    caution_cm: 200.0    # 100 - 200 cm = CAUTION; beyond = SAFE
  hysteresis_cm: 10.0    # Risk rises at a threshold but only falls once 10 cm past it (stops flicker)
  zones:                 # Horizontal image split into LEFT | CENTER | RIGHT (fraction of frame width)
    left_boundary: 0.33
    right_boundary: 0.66

direction:
  clear_path_threshold: 2.0  # meters of clear space to recommend direction
  side_hysteresis_m: 0.3     # keep the chosen escape side unless the other is this much clearer

alerts:
  voice:
    enabled: true
    speech_rate: 160
    volume: 0.9
    cooldown_seconds: 2.0
    clear_confirm_seconds: 1.0  # Say "Path clear" only after 1 s without hazards
  vibration:
    type: "simulated"  # Options: "simulated", "gpio"
    enabled: true
    gpio_pins:         # BCM pins for future motors; must not overlap the ultrasonic pins above
      left: 5
      center: 6
      right: 13

dashboard:
  enabled: true
  refresh_interval: 0.2
  show_side_panel: true   # Simulated shoe panel (sensor cones, motors, guidance) beside the video
  show_zone_lines: true   # LEFT | CENTER | RIGHT dividers on the video
  scenario_window: true   # Show the panel in a window during --mode scenario

logging:
  enabled: true
  level: "INFO"           # Level written to system_log
  console_level: "WARNING" # Terminal shows only warnings/errors (keeps the CLI dashboard clean)
  format: "%(asctime)s - [%(name)s] - %(levelname)s - %(message)s"
  event_log: "logs/detection_events.csv"
  system_log: "logs/system.log"

