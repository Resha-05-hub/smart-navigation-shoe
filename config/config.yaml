# Smart Navigation Shoe Configuration

system:
  mode: "fusion"  # Options: "fusion", "alerts", "detection", "sensors", "simulation", "raspberry_pi"
  environment: "windows_laptop"

camera:
  type: "webcam"       # Options: "webcam", "raspberry_pi"
  device_id: 0
  width: 640
  height: 480
  fps: 30
  frame_skip: 0
  simulation_fallback: false

detection:
  model_name: "yolov8n.pt"
  model_path: "models/yolov8n.pt"
  confidence_threshold: 0.5
  iou_threshold: 0.45
  device: "cpu"        # Options: "cpu", "cuda"
  display:
    window_name: "Smart Navigation Shoe - Phase 5 Sensor Fusion & Alerts"
    show_confidence: true
    show_box: true
    color_bgr: [0, 255, 0]
  # Only these COCO class names are detected (empty list = all 80 classes).
  # Stairs/doors are not COCO classes; low obstacles are caught by the distance sensors instead.
  target_classes:
    - person
    - bicycle
    - car
    - motorcycle
    - bus
    - truck
    - dog
    - chair
    - couch
    - potted plant
    - dining table

sensors:
  distance_sensor:
    type: "simulated"  # Options: "simulated", "ultrasonic"
    unit: "cm"         # Display unit: "cm" or "m"
    min_distance_m: 0.2
    max_distance_m: 4.0
    simulated_default_m: 2.5
    simulated_positions:  # Startup distances (clear path); the scenario engine moves them at runtime
      left_cm: 300.0
      center_cm: 300.0
      right_cm: 300.0
    update_interval_sec: 0.1
    gpio_trigger_pins:
      left: 23
      center: 17
      right: 22
    gpio_echo_pins:
      left: 24
      center: 27
      right: 10

  # Software-only demo: drives the SIMULATED distance sensors (no physical HC-SR04 hardware).
  simulation:
    startup: "manual"  # "manual" (keyboard control) or a scenario name below
    step_cm: 10.0      # Distance change per key press
    noise_cm: 1.0      # Gaussian jitter mimicking real ultrasonic readings (0 = none)
    loop: true         # Scripted scenarios restart when finished (live camera modes)
    # Keyframes: [time_s, left_cm, center_cm, right_cm]; values glide linearly between frames.
    # null = sensor fault (reported INVALID) from that keyframe until the next one.
    scenarios:
      approaching_obstacle:
        description: "Obstacle straight ahead closes from 3 m to 30 cm, then clears"
        keyframes:
          - [0, 300, 300, 300]
          - [2, 300, 300, 300]
          - [9, 300, 30, 300]
          - [12, 300, 30, 300]
          - [14, 300, 300, 300]
      passing_left_then_right:
        description: "Obstacle passes close on the left, then on the right"
        keyframes:
          - [0, 300, 300, 300]
          - [4, 60, 300, 300]
          - [6, 60, 300, 300]
          - [8, 300, 300, 300]
          - [12, 300, 300, 60]
          - [14, 300, 300, 60]
          - [16, 300, 300, 300]
      narrow_corridor:
        description: "Walls close in on both sides while the path ahead stays open"
        keyframes:
          - [0, 120, 300, 110]
          - [6, 70, 280, 80]
          - [10, 120, 300, 110]
      mixed_zones:
        description: "Static example: LEFT 150 cm (CAUTION), CENTER 80 cm (WARNING), RIGHT 220 cm (SAFE)"
        keyframes:
          - [0, 150, 80, 220]
      sensor_fault:
        description: "CENTER sensor fails for 4 s, then recovers"
        keyframes:
          - [0, 300, 120, 300]
          - [3, 300, null, 300]
          - [7, 300, 120, 300]
          - [10, 300, 120, 300]

risk_analysis:
  thresholds_cm:
    danger_cm: 50.0      # < 50 cm = DANGER
    warning_cm: 100.0    # 50 - 100 cm = WARNING
    caution_cm: 200.0    # 100 - 200 cm = CAUTION
    safe_cm: 200.0       # > 200 cm = SAFE
  critical_distance_m: 0.5
  warning_distance_m: 1.0
  safe_distance_m: 2.0
  zones:
    left_boundary: 0.33
    right_boundary: 0.66

direction:
  clear_path_threshold: 2.0  # meters of clear space to recommend direction

alerts:
  voice:
    enabled: true
    speech_rate: 160
    volume: 0.9
    cooldown_seconds: 2.0
  vibration:
    type: "simulated"  # Options: "simulated", "gpio"
    enabled: true
    gpio_pins:
      left: 17
      center: 27
      right: 22

dashboard:
  enabled: true
  refresh_interval: 0.2

logging:
  enabled: true
  level: "INFO"
  format: "%(asctime)s - [%(name)s] - %(levelname)s - %(message)s"
  log_file: "logs/system.log"
  event_log: "logs/detection_events.csv"
  system_log: "logs/system.log"

